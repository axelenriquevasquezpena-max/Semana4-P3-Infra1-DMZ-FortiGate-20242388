! Transcripcion normalizada del show running-config aportado.
! Banners del fabricante y lineas vacias omitidos. VLANs en archivo separado.
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
hostname SW-USUARIOS
boot-start-marker
boot-end-marker
no aaa new-model
ip cef
no ipv6 cef
spanning-tree mode pvst
spanning-tree extend system-id
!
interface GigabitEthernet0/0
 description TRUNK-HACIA-FORTIGATE-PORT2
 switchport trunk allowed vlan 10,20
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 negotiation auto
!
interface GigabitEthernet0/1
 description KALI-VLAN10
 switchport access vlan 10
 switchport mode access
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 switchport port-security mac-address sticky 000c.2927.4516
 switchport port-security
 negotiation auto
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/2
 description KALI-VLAN20
 switchport access vlan 20
 switchport mode access
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 switchport port-security mac-address sticky 000c.2998.d580
 switchport port-security
 negotiation auto
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/3
 shutdown
 negotiation auto
!
interface GigabitEthernet1/0
 shutdown
 negotiation auto
!
interface GigabitEthernet1/1
 shutdown
 negotiation auto
!
interface GigabitEthernet1/2
 shutdown
 negotiation auto
!
interface GigabitEthernet1/3
 shutdown
 negotiation auto
!
interface GigabitEthernet2/0
 shutdown
 negotiation auto
!
interface GigabitEthernet2/1
 shutdown
 negotiation auto
!
interface GigabitEthernet2/2
 shutdown
 negotiation auto
!
interface GigabitEthernet2/3
 shutdown
 negotiation auto
!
interface GigabitEthernet3/0
 shutdown
 negotiation auto
!
interface GigabitEthernet3/1
 shutdown
 negotiation auto
!
interface GigabitEthernet3/2
 shutdown
 negotiation auto
!
interface GigabitEthernet3/3
 shutdown
 negotiation auto
!
ip forward-protocol nd
ip http server
ip http secure-server
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
control-plane
line con 0
line aux 0
line vty 0 4
 login
end
